server:
  port: 10005

spring:
  jpa:
    hibernate:
      ddl-auto: create

  datasource:
    url: jdbc:postgresql://localhost:5432/followme
    username: ${DB_USERNAME:followme}
    password: ${DB_PASSWORD:followme}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  kafka:
    bootstrap-servers: 172.31.10.105:9092,172.31.1.110:9092,172.31.15.248:9092
    properties:
      security.protocol: SSL
      ssl.truststore.location: classpath:kafka.truststore.jks
      ssl.truststore.password: ${KAFKA_TRUSTSTORE_PASSWORD}
      ssl.endpoint.identification.algorithm: ""
